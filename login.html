<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numa - Masuk</title>
  
  <!-- Font Google: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icon FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- File CSS Eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Atas -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fa-solid fa-plus"></i>
      </div>
      <span class="logo-text">numa<span class="dot">.</span></span>
    </div>
  </header>

  <!-- Kontainer Utama -->
  <main class="main-container">
    <div class="card">
      
      <!-- Pill Badge Header -->
      <div class="badge-welcome">
        <span class="wave-icon">👋</span> Selamat Datang Kembali!
      </div>

      <h1 class="card-title">Masuk ke Numa</h1>
      <p class="card-subtitle">
        Lanjutkan petualangan matematika dan pertahankan posisimu di Liga Pythagoras mingguan!
      </p>

      <!-- Tombol Login Sosial / SSO Top -->
      <div class="social-login-grid mb-1-5">
        <button type="button" class="btn-social">
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <i class="fa-solid fa-graduation-cap school-icon"></i>
          Akun Sekolah (SSO)
        </button>
      </div>

      <!-- Pembatas (Divider) -->
      <div class="divider">
        <span>ATAU DENGAN AKUN NUMA</span>
      </div>

      <!-- Form Login -->
      <form class="login-form" onsubmit="event.preventDefault();">
        
        <!-- Input 1: Email / Username -->
        <div class="form-group">
          <label for="username" class="label-bold">Email atau Username Siswa</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="username" placeholder="arka_juara atau email@sekolah.id" required>
          </div>
        </div>

        <!-- Input 2: Kata Sandi -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="label-bold">Kata Sandi</label>
            <a href="#" class="link-forgot">Lupa Kata Sandi?</a>
          </div>
          <div class="input-wrapper">
            <i class="fa-regular fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Masukkan setidaknya 8 karakter" required>
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>
        </div>

        <!-- Checkbox Remember Me & Sesi Aman Indicator -->
        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" checked>
            <span class="checkmark"></span>
            Ingat saya di perangkat ini
          </label>
          <div class="badge-safe">
            <i class="fa-regular fa-shield-check"></i> Sesi Aman
          </div>
        </div>

        <!-- Tombol Submit Login -->
        <button type="submit" class="btn-primary">
          Masuk ke Numa <i class="fa-solid fa-rocket"></i>
        </button>

      </form>

      <!-- Banner Promo / Register Link Card -->
      <div class="banner-register">
        <div class="banner-left">
          <span class="gift-icon">🎁</span>
          <span>Belum punya akun Numa?</span>
        </div>
        <a href="register.html" class="btn-secondary-white">Daftar Gratis</a>
      </div>

    </div>
  </main>

</body>
</html>
